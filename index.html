<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThaurovêniaRPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sheet">
    <section class="top-grid">
      <label class="field wide"><span>NOME:</span><input id="nome" type="text" maxlength="120"></label>
      <label class="field wide"><span>JOGADOR:</span><input id="jogador" type="text" maxlength="120"></label>

      <label class="field"><span>NVL:</span><input id="nivel" type="number" min="0" max="20" value="0"></label>
      <label class="field"><span>XP:</span><input id="xp" type="number" min="0" max="999" value="0"></label>
      <div class="field rsq-field">
        <span>RSQ:</span>
        <div class="rsq-options" role="group" aria-label="Resistência">
          <label class="rsq-option rsq-yellow"><input type="radio" name="rsq" value="amarelo"><i></i></label>
          <label class="rsq-option rsq-light-yellow"><input type="radio" name="rsq" value="amarelo-claro"><i></i></label>
          <label class="rsq-option rsq-gray"><input type="radio" name="rsq" value="cinza"><i></i></label>
          <label class="rsq-option rsq-light-red"><input type="radio" name="rsq" value="vermelho-claro"><i></i></label>
          <label class="rsq-option rsq-red"><input type="radio" name="rsq" value="vermelho"><i></i></label>
        </div>
      </div>
      <label class="field"><span>CLASSE:</span><input id="classe" type="text" maxlength="80"></label>
      <label class="field"><span>CAMINHO:</span><input id="caminho" type="text" maxlength="80"></label>
    </section>

    <section class="main-grid">
      <section class="attributes-panel">
        <div class="attribute-wheel">
          <div class="attribute top yellow">
            <label>MENTE<input id="men" type="number" min="1" max="6" value="1"></label>
          </div>
          <div class="attribute right red">
            <label>FÍSICO<input id="fis" type="number" min="1" max="6" value="1"></label>
          </div>
          <div class="attribute bottom purple">
            <label>PRONTIDÃO<input id="pro" type="number" min="1" max="6" value="1"></label>
          </div>
          <div class="attribute left blue">
            <label>RESISTÊNCIA<input id="res" type="number" min="1" max="6" value="1"></label>
          </div>
          <div class="attribute center">
            <label>SORTE<input id="sor" type="number" min="0" max="4" value="0"></label>
          </div>
        </div>

        <div class="resource-grid">
          <section class="resource-box">
            <h2>VIDA</h2>
            <div class="resource-values">
              <label>ATUAL<input id="vidaAtual" type="number" min="0" max="999" value="0"></label>
              <label>MÁXIMA<input id="vidaMaxima" type="number" min="0" max="999" value="0"></label>
            </div>
          </section>
          <section class="resource-box">
            <h2>VONTADE</h2>
            <div class="resource-values">
              <label>ATUAL<input id="vontadeAtual" type="number" min="0" max="999" value="0"></label>
              <label>MÁXIMA<input id="vontadeMaxima" type="number" min="0" max="999" value="0"></label>
            </div>
          </section>
        </div>
      </section>

      <section class="right-panel">
        <section class="notes-box">
          <h2>ANOTAÇÕES</h2>
          <textarea id="anotacoes" spellcheck="false"></textarea>
        </section>

        <section class="combat-panel">
          <div class="combat-stat"><h3>ESQUIVA</h3><output id="esquiva">9</output></div>
          <div class="combat-stat"><h3>BLOQUEIO</h3><output id="bloqueio">7</output></div>
          <div class="combat-stat"><h3>ATAQUE</h3><output id="ataque">7</output></div>
          <div class="actions">
            <button id="salvar" type="button">SALVAR</button>
            <button id="copiar" type="button" disabled>COPIAR <span aria-hidden="true">🔗</span></button>
          </div>
        </section>
      </section>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
